<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>

  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:image" content="{{ image_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="{{ canonical_url }}">
  <meta property="og:type" content="website">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ title }}">
  <meta name="twitter:description" content="{{ description }}">
  <meta name="twitter:image" content="{{ image_url }}">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a0a3d;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
    }
    .card {
      padding: 32px;
    }
    h1 {
      color: #fff;
      font-size: 1.3em;
      margin: 0 0 20px;
    }
    a.btn {
      display: inline-block;
      padding: 14px 28px;
      background: #ffee00;
      color: #1a0a3d;
      font-weight: bold;
      text-decoration: none;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <!-- Redirect is delayed rather than instant: link-preview bots (esp. iMessage's
       LinkPresentation, which can render this page in a real WebKit view and run
       JS) grab their OG-tag snapshot quickly and don't hang around for a timer, so
       a short delay keeps their preview showing our card. A real page-open still
       waits out the same short delay, then continues on automatically. -->
  <div class="card">
    <h1>{{ title }}</h1>
    <a class="btn" href="{{ redirect_url }}">Get Tickets &raquo;</a>
  </div>
  <script>
    setTimeout(function () {
      window.location.replace("{{ redirect_url }}");
    }, 600);
  </script>
</body>
</html>
