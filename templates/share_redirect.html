<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>

  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:image" content="{{ image_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="{{ canonical_url }}">
  <meta property="og:type" content="website">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ title }}">
  <meta name="twitter:description" content="{{ description }}">
  <meta name="twitter:image" content="{{ image_url }}">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a0a3d;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
    }
    .card {
      padding: 32px;
    }
    h1 {
      color: #fff;
      font-size: 1.3em;
      margin: 0 0 20px;
    }
    a.btn {
      display: inline-block;
      padding: 14px 28px;
      background: #ffee00;
      color: #1a0a3d;
      font-weight: bold;
      text-decoration: none;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <!-- No auto-redirect: link-preview bots (esp. iMessage's LinkPresentation, which
       renders this page in a real WebKit view and runs JS) would otherwise navigate
       away before/while grabbing the OG tags, showing the ticket site's preview
       instead of ours. Tap-through keeps the custom card reliable. -->
  <div class="card">
    <h1>{{ title }}</h1>
    <a class="btn" href="{{ redirect_url }}">Get Tickets &raquo;</a>
  </div>
</body>
</html>
